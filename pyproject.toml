[project]
name = "consensai"
version = "0.1.0"
description = "Multi-LLM orchestration system with consensus mechanism for reliable answers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bronislav" }
]
keywords = ["llm", "consensus", "benchmark", "ai", "orchestration"]

dependencies = [
    # Web framework
    "fastapi~=0.163.0",
    "uvicorn[standard]~=0.54.0",

    # Data validation
    "pydantic~=2.14.0",
    "pydantic-settings~=2.16.0",

    # LLM integration
    "litellm~=1.110.0",
    "pydantic-ai~=2.70.0",

    # Async HTTP client
    "httpx~=0.28.0",

    # Database
    "sqlalchemy[asyncio]~=2.1.0",
    "aiosqlite~=0.22.0",
    "greenlet>=3.1.0",

    # Logging
    "structlog~=26.1.0",

    # Utils
    "python-dotenv~=1.2.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit~=1.67.0",
    "plotly~=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ============================================================================
# UV Configuration
# ============================================================================
# UV is used for fast, secure dependency management with lockfile support.
# See: https://docs.astral.sh/uv/
#
# Key security features:
# - Lockfile with hashes prevents supply chain attacks
# - Reproducible builds across environments
# - Native support for --require-hashes
# ============================================================================

# Development dependencies (PEP 735)
[dependency-groups]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=5.0.0",
    "ruff~=0.7.0",
    "mypy~=1.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
