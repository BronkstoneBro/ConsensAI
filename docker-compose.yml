# =============================================================================
# ConsensAI Docker Compose Configuration
# =============================================================================
# Uses UV for fast, secure dependency management with lockfile verification.
#
# Quick start:
#   docker compose up -d
#
# For production, set environment variables:
#   GROQ_API_KEY=your-key
#   LITELLM_MASTER_KEY=your-secure-key (optional, for LiteLLM proxy auth)
# =============================================================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: consensai-api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite+aiosqlite:///./data/consensai.db
      - LOG_LEVEL=INFO
      # LiteLLM Proxy Authentication (optional, for production)
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: consensai-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: consensai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pull models on first run:
    # docker exec consensai-ollama ollama pull llama3
    # docker exec consensai-ollama ollama pull mistral

volumes:
  ollama_data:

networks:
  default:
    name: consensai-network
