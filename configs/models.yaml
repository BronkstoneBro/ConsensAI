# Model Configuration for ConsensAI
# Define which models to use for different scenarios

# Default models for consensus queries
default_consensus_models:
  - groq/llama3-8b-8192
  - groq/mixtral-8x7b-32768

# Models for benchmarking (all available)
benchmark_models:
  ollama:
    - ollama/llama3.2
    - ollama/mistral
    - ollama/phi3
    - ollama/gemma2
  groq:
    - groq/llama3-8b-8192
    - groq/llama3-70b-8192
    - groq/mixtral-8x7b-32768

# Judge model for resolving disagreements
judge_model: groq/llama3-70b-8192

# Model capabilities and recommended use cases
model_info:
  ollama/llama3.2:
    description: "Meta Llama 3.2 - balanced performance"
    strengths: ["math", "reasoning", "general"]
    context_window: 128000

  ollama/mistral:
    description: "Mistral 7B - fast and efficient"
    strengths: ["math", "coding", "general"]
    context_window: 32000

  ollama/phi3:
    description: "Microsoft Phi-3 - compact but capable"
    strengths: ["reasoning", "math"]
    context_window: 128000

  groq/llama3-8b-8192:
    description: "Groq-hosted Llama 3 8B - extremely fast"
    strengths: ["speed", "general"]
    context_window: 8192

  groq/llama3-70b-8192:
    description: "Groq-hosted Llama 3 70B - high quality"
    strengths: ["reasoning", "math", "complex tasks"]
    context_window: 8192

  groq/mixtral-8x7b-32768:
    description: "Groq-hosted Mixtral 8x7B - balanced"
    strengths: ["reasoning", "coding", "general"]
    context_window: 32768
